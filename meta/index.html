<!DOCTYPE html>
<html lang="en">
<head>
    <script src="main.js" type="module"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta — Irina Vardapetyan</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Meta</h1>
    <p>Stats and analysis about the code behind this website.</p>
    <div style="display: flex; flex: 1; align-items: baseline; width: 100%;">
        <label style="width: 100%;">
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" style="width: 100%;" />
            <time id="commit-time" style="margin-left: auto; display: block;"></time>
        </label>
    </div>
    <div id="stats"></div>
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
        <div id="scatter-story">some filler text here</div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>
    <dl id="files"></dl>
    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank"></a></dd>
        <dt>Date</dt>
        <dd id="commit-date"></dd>
        <dt>Time</dt>
        <dd id="commit-time-tooltip"></dd>
        <dt>Author</dt>
        <dd id="commit-author"></dd>
        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
